[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2r-omega"
version = "0.1.0"
description = "P2R-Ω Core — Proof-to-Realization Object"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
p2r-sentinel = "sentinel.__main__:main"

[tool.setuptools]
package-dir = {"" = "src", "sentinel" = "sentinel"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["p2r*", "sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
